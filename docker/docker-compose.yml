services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
  prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
